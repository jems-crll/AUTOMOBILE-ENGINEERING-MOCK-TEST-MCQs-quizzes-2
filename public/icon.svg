<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="4"/>
  <!-- Outer precision gear teeth -->
  <g transform="translate(256, 256)">
    <circle r="134" stroke="url(#amberGrad)" stroke-width="26" stroke-dasharray="32 20.6" stroke-linecap="butt"/>
    <circle r="106" fill="#0f172a" stroke="url(#amberGrad)" stroke-width="14"/>
    <circle r="54" fill="url(#amberGrad)"/>
    <!-- Stylized wrench / piston mark in center -->
    <path d="M-24 -24 L24 24 M24 -24 L-24 24" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    <circle r="16" fill="#0f172a"/>
  </g>
</svg>
